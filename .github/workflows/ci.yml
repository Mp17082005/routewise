name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests app
          ruff format --check src tests app
      - name: Data is reproducible from seed 42
        run: |
          routewise generate-data --seed 42
          git diff --exit-code -- data/
      - name: Validate data
        run: routewise validate
      - name: Tests + coverage
        run: python -m pytest --cov=routewise --cov-report=term-missing --cov-fail-under=85
      - name: Evaluation runs end to end
        run: routewise evaluate --out /tmp/reports
